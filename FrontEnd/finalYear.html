<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Emote Bro | Affective Intelligence</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/vision_bundle.js" crossorigin="anonymous"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --bg-neutral: #050506; --accent: #06b6d4; --glass: rgba(20, 20, 25, 0.8); }
        .theme-happy { --bg-current: #06241c; --accent: #10b981; }
        .theme-sad { --bg-current: #0a1128; --accent: #3b82f6; }
        .theme-frustrated { --bg-current: #240a0a; --accent: #ef4444; }
        .theme-surprised { --bg-current: #24180a; --accent: #f59e0b; }
        
        body { margin: 0; background: #000; font-family: 'Inter', sans-serif; color: #fff; height: 100vh; height: -webkit-fill-available; overflow-x: hidden; }
        #phone-wrapper { width: 100%; min-height: 100vh; background: var(--bg-current, var(--bg-neutral)); transition: background 1.5s ease; position: relative; display: flex; flex-direction: column; align-items: center; }
        
        #onboarding, #privacy-popup { position: fixed; inset: 0; z-index: 60; background: #000; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; text-align: center; }
        #privacy-popup { background: rgba(0,0,0,0.95); backdrop-filter: blur(20px); display: none; }
        
        .fade-in { animation: fadeIn 1s ease forwards; opacity: 0; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Mobile-First Layout */
        #app { display: none; width: 100%; max-width: 1200px; padding: 20px; gap: 20px; flex-direction: column; opacity: 0; transition: opacity 1s ease; }
        @media (min-width: 1024px) { #app { display: none; grid-template-columns: 300px 1fr 300px; height: 85vh; margin: auto; } }

        .panel { background: var(--glass); backdrop-filter: blur(30px); border-radius: 32px; border: 1px solid rgba(255,255,255,0.08); padding: 20px; display: flex; flex-direction: column; min-height: 200px; }
        
        #history-list { flex-grow: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; max-height: 300px; }
        .history-item { background: rgba(255,255,255,0.03); padding: 12px; border-radius: 18px; font-size: 0.8rem; border-left: 3px solid var(--accent); }
        
        .view-circle { width: 240px; height: 240px; border-radius: 50%; overflow: hidden; border: 3px solid #fff; background: #111; position: relative; display: flex; justify-content: center; align-items: center; flex-shrink: 0; }
        @media (min-width: 768px) { .view-circle { width: 300px; height: 300px; } }
        video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
        
        .input-box { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 24px; padding: 4px; width: 100%; display: flex; align-items: center; }
        #user-text { background: transparent; border: none; outline: none; color: #fff; flex-grow: 1; font-size: 16px; padding: 0 15px; height: 44px; }
        
        .control-btn { width: 50px; height: 50px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); font-size: 1.2rem; cursor: pointer; transition: 0.3s; }
        .control-btn.active { background: var(--accent); box-shadow: 0 0 20px var(--accent); border-color: #fff; }

        #transcription-pill { opacity: 0; transform: translateY(10px); transition: 0.4s; pointer-events: none; }
        #transcription-pill.active { opacity: 1; transform: translateY(0); }
    </style>
</head>
<body>
    <div id="phone-wrapper">
        <div id="onboarding">
            <h1 class="text-5xl md:text-7xl font-black mb-2 fade-in">Emote Bro <span id="emoji-swap">🫣</span></h1>
            <p class="text-cyan-400 font-medium tracking-widest uppercase fade-in text-sm md:text-xl" style="animation-delay: 0.3s">Emote to Demote</p>
            <button id="launch-btn" class="mt-12 bg-white text-black px-10 py-4 rounded-full font-bold hover:scale-105 transition-all fade-in" style="animation-delay: 0.6s">LAUNCH</button>
        </div>

        <div id="privacy-popup">
            <div class="max-w-xs fade-in">
                <div class="text-4xl mb-4">🛡️</div>
                <h2 class="text-xl font-black uppercase mb-3">Privacy Check</h2>
                <p class="text-slate-400 text-sm mb-8">Processing happens on your device. Audio & video are never stored.</p>
                <button id="accept-privacy" class="w-full bg-cyan-500 text-white py-4 rounded-xl font-black uppercase tracking-widest">I Agree</button>
            </div>
        </div>

        <div id="app" class="flex">
            <div class="panel order-2 lg:order-1">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-[10px] font-black text-slate-500 uppercase tracking-widest">Memory Bank</h2>
                    <button onclick="clearMemory()" class="text-[9px] text-red-500 font-bold uppercase">Clear</button>
                </div>
                <div id="history-list"></div>
            </div>

            <div class="flex flex-col items-center justify-start py-4 order-1 lg:order-2">
                <div class="view-circle mb-6" id="borderFrame">
                    <video id="webcam" autoplay playsinline muted></video>
                </div>
                
                <div class="w-full max-w-md flex flex-col items-center">
                    <div id="mood-label" class="text-[10px] font-black tracking-[0.5em] uppercase mb-4 text-cyan-400">Waiting...</div>
                    
                    <div id="transcription-pill" class="bg-white/10 px-6 py-2 rounded-full border border-white/10 mb-6 backdrop-blur-xl">
                        <p id="transcription-text" class="text-[11px] text-slate-300 italic text-center">Listening...</p>
                    </div>

                    <div class="flex gap-6 mb-8">
                        <button id="camBtn" class="control-btn">📷</button>
                        <button id="micBtn" class="control-btn">🎤</button>
                    </div>

                    <div class="w-full bg-white/5 border border-white/10 p-6 rounded-[32px] min-h-[140px] flex items-center justify-center backdrop-blur-md">
                        <div id="advice-display" class="text-md text-center font-medium italic text-slate-200 leading-relaxed">Ready to vibe...</div>
                    </div>
                </div>
            </div>

            <div class="panel justify-center items-center order-3">
                <h2 class="text-[10px] font-black text-slate-500 uppercase tracking-widest mb-6 text-center">Type Your Mind</h2>
                <div class="input-box">
                    <input type="text" id="user-text" placeholder="Tell me anything...">
                </div>
                <p class="text-[8px] text-slate-600 mt-4 font-bold uppercase text-center">Tap Enter to Send</p>
            </div>
        </div>
    </div>

<script type="module">
    import { FaceLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3";

    let faceLandmarker, video = document.getElementById("webcam"), currentMood = "Neutral";
    let camStream = null, micStream = null, mediaRecorder, audioChunks = [], voteBuffer = [];
    let sessionMood = "Neutral", isInteracting = false;

    // Emoji Scroller
    const ems = ["🫣","😀","😔","😡","😲"];
    let i = 0; setInterval(() => { document.getElementById('emoji-swap').innerText = ems[i++ % ems.length]; }, 1500);

    // Transitions
    document.getElementById('launch-btn').onclick = () => {
        document.getElementById('onboarding').style.display = 'none';
        document.getElementById('privacy-popup').style.display = 'flex';
    };

    document.getElementById('accept-privacy').onclick = async () => {
        document.getElementById('privacy-popup').style.display = 'none';
        const app = document.getElementById('app');
        app.style.display = window.innerWidth >= 1024 ? 'grid' : 'flex';
        setTimeout(() => app.style.opacity = '1', 50);
        
        renderHistory();
        const vision = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/wasm");
        faceLandmarker = await FaceLandmarker.createFromOptions(vision, {
            baseOptions: { modelAssetPath: "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task", delegate: "GPU" },
            outputFaceBlendshapes: true, runningMode: "VIDEO", numFaces: 1
        });
    };

    // Glow-up Detection
    document.getElementById('user-text').oninput = () => isInteracting = true;

    async function sendData(payload, isAudio = false) {
        setTimeout(async () => {
            const finalMood = sessionMood !== "Neutral" ? sessionMood : currentMood;
            isInteracting = false; sessionMood = "Neutral";
            
            try {
                const url = 'https://hahe050305-emote-bro-finalpunch.hf.space/analyze';
                let res;
                if(isAudio) {
                    res = await fetch(url, { method: 'POST', body: payload });
                } else {
                    res = await fetch(url, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({...payload, face: finalMood}) });
                }
                const data = await res.json();
                if(data.transcription) document.getElementById('transcription-text').innerText = `"${data.transcription}"`;
                typeWriter(data.advice);
                saveChat(isAudio ? "Voice" : "Text", data.advice);
            } catch(e) { console.error(e); }
        }, 200); // 200ms grace period for glow-up
    }

    document.getElementById('user-text').onkeypress = (e) => {
        if(e.key === 'Enter') {
            const text = e.target.value;
            e.target.value = "";
            sendData({ text });
        }
    };

    document.getElementById('micBtn').onclick = async () => {
        if (mediaRecorder?.state === "recording") {
            mediaRecorder.stop();
            document.getElementById('micBtn').classList.remove('active');
            return;
        }
        micStream = micStream || await navigator.mediaDevices.getUserMedia({ audio: true });
        mediaRecorder = new MediaRecorder(micStream);
        audioChunks = [];
        mediaRecorder.onstart = () => {
            isInteracting = true; sessionMood = "Neutral";
            document.getElementById('micBtn').classList.add('active');
            document.getElementById('transcription-pill').classList.add('active');
        };
        mediaRecorder.onstop = () => {
            const fd = new FormData();
            fd.append('audio', new Blob(audioChunks));
            fd.append('face', sessionMood !== "Neutral" ? sessionMood : currentMood);
            sendData(fd, true);
            setTimeout(() => document.getElementById('transcription-pill').classList.remove('active'), 3000);
        };
        mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
        mediaRecorder.start();
    };

    document.getElementById('camBtn').onclick = async () => {
        if (camStream) {
            camStream.getTracks().forEach(t => t.stop()); camStream = null;
            document.getElementById('camBtn').classList.remove('active');
        } else {
            camStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
            video.srcObject = camStream;
            document.getElementById('camBtn').classList.add('active');
            video.onloadedmetadata = () => runDetection();
        }
    };

    function runDetection() {
        if (!camStream || !faceLandmarker) return;
        const result = faceLandmarker.detectForVideo(video, performance.now());
        if (result.faceBlendshapes?.[0]) {
            const s = result.faceBlendshapes[0].categories.reduce((acc, c) => (acc[c.categoryName] = c.score, acc), {});
            let instant = "Neutral";
            if (s.eyeWideLeft > 0.1 || s.jawOpen > 0.5) instant = "Surprised";
            else if (s.mouthSmileLeft > 0.2) instant = "Happy";
            else if (s.browInnerUp > 0.6) instant = "Sad";
            else if (s.browDownLeft > 0.15) instant = "Frustrated";

            if (isInteracting && instant !== "Neutral") sessionMood = instant;

            voteBuffer.push(instant);
            if (voteBuffer.length > 25) {
                const winner = voteBuffer.reduce((a, b, i, arr) => (arr.filter(v => v===a).length >= arr.filter(v => v===b).length ? a : b));
                if (winner !== currentMood) {
                    currentMood = winner;
                    document.body.className = `theme-${winner.toLowerCase()}`;
                    document.getElementById('mood-label').innerText = winner;
                }
                voteBuffer.shift();
            }
        }
        requestAnimationFrame(runDetection);
    }

    function saveChat(type, text) {
        const h = JSON.parse(localStorage.getItem('emote_chats') || "[]");
        h.unshift({ type, text, time: new Date().toLocaleTimeString() });
        localStorage.setItem('emote_chats', JSON.stringify(h.slice(0, 20)));
        renderHistory();
    }
    function renderHistory() {
        const list = document.getElementById('history-list');
        list.innerHTML = JSON.parse(localStorage.getItem('emote_chats') || "[]").map(item => `
            <div class="history-item">
                <div class="text-[8px] opacity-40 font-bold mb-1 uppercase">${item.type} • ${item.time}</div>
                <div>${item.text}</div>
            </div>
        `).join('');
    }
    function typeWriter(text) {
        const el = document.getElementById('advice-display'); el.innerHTML = "";
        let i = 0; const itv = setInterval(() => {
            if (i < text.length) el.innerHTML += text.charAt(i++);
            else clearInterval(itv);
        }, 20);
    }
</script>
</body>
</html>
