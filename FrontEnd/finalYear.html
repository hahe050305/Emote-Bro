<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>Emote Bro | Affective Intelligence</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/vision_bundle.js" crossorigin="anonymous"></script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">

    <style>

        :root { --bg-neutral: #050506; --accent: #06b6d4; --glass: rgba(25, 25, 30, 0.9); }

        .theme-happy { --bg-current: #06241c; --accent: #10b981; }

        .theme-sad { --bg-current: #0a1128; --accent: #3b82f6; }

        .theme-frustrated { --bg-current: #240a0a; --accent: #ef4444; }

        .theme-surprised { --bg-current: #24180a; --accent: #f59e0b; }

        body { margin: 0; background: #000; font-family: 'Inter', sans-serif; color: #fff; height: 100dvh; overflow: hidden; }

        #phone-wrapper { width: 100%; height: 100dvh; background: var(--bg-current, var(--bg-neutral)); transition: background 1.5s ease; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; }

        .overlay { position: fixed; inset: 0; z-index: 200; background: #000; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; text-align: center; }

        #sidebar { position: fixed; top: 0; left: -280px; width: 280px; height: 100%; background: var(--glass); backdrop-filter: blur(25px); z-index: 100; transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1); border-right: 1px solid rgba(255,255,255,0.1); display: flex; flex-direction: column; padding: 20px; }

        #sidebar.open { left: 0; box-shadow: 20px 0 50px rgba(0,0,0,0.5); }

        .main-content { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: space-evenly; width: 100%; max-width: 500px; padding: 20px; }

        .view-circle { width: 230px; height: 230px; border-radius: 50%; overflow: hidden; border: 3px solid #fff; background: #111; position: relative; box-shadow: 0 0 40px rgba(0,0,0,0.6); }

        video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }

        .advice-box { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 28px; padding: 20px; width: 100%; min-height: 110px; display: flex; align-items: center; justify-content: center; text-align: center; backdrop-filter: blur(10px); font-style: italic; }

        .hamburger { position: absolute; top: 20px; left: 20px; z-index: 110; cursor: pointer; opacity: 0; transition: 0.5s; }

        .hamburger.visible { opacity: 1; }

        #history-list { flex-grow: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; margin-top: 20px; }

        .history-item { background: rgba(255,255,255,0.05); padding: 12px; border-radius: 15px; font-size: 0.8rem; border-left: 3px solid var(--accent); }

    </style>

</head>

<body>



    <div id="phone-wrapper">

        <div id="menu-btn" class="hamburger" onclick="toggleSidebar()">

            <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>

        </div>



        <div id="sidebar">

            <div class="flex justify-between items-center mt-12 border-b border-white/10 pb-4">

                <h2 class="text-[10px] font-black uppercase tracking-widest text-slate-400">Memory Bank</h2>

                <button onclick="localStorage.removeItem('emote_chats'); renderHistory();" class="text-[10px] text-red-500 font-bold uppercase">Clear</button>

            </div>

            <div id="history-list"></div>

        </div>



        <div id="onboarding" class="overlay">

            <h1 class="text-5xl font-black mb-2">Emote Bro <span id="emoji-swap">🫣</span></h1>

            <p class="text-cyan-400 tracking-widest uppercase text-xs">Emote to Demote</p>

            <button id="launch-btn" class="mt-12 bg-white text-black px-10 py-4 rounded-full font-bold transition-transform active:scale-95">LAUNCH</button>

        </div>



        <div id="privacy-popup" class="overlay" style="display: none; background: rgba(0,0,0,0.9); backdrop-filter: blur(20px);">

            <div class="max-w-xs">

                <div class="text-4xl mb-4">🛡️</div>

                <h2 class="text-xl font-black uppercase mb-3">Privacy Check</h2>

                <p class="text-slate-400 text-sm mb-8">Processing happens on your device. Audio and video are never stored.</p>

                <button id="accept-privacy" class="w-full bg-cyan-500 text-white py-4 rounded-xl font-black uppercase tracking-widest">I Agree</button>

            </div>

        </div>



        <div id="app-ui" style="display: none; width: 100%; height: 100%;">

            <div class="main-content">

                <div id="mood-label" class="text-[10px] font-black tracking-[0.5em] uppercase text-cyan-400">Waiting...</div>

                <div class="view-circle"><video id="webcam" autoplay playsinline muted></video></div>

                <div class="flex gap-8">

                    <button id="camBtn" class="w-14 h-14 rounded-full bg-white/5 border border-white/10 flex items-center justify-center text-xl">📷</button>

                    <button id="micBtn" class="w-14 h-14 rounded-full bg-white/5 border border-white/10 flex items-center justify-center text-xl">🎤</button>

                </div>

                <div class="advice-box"><div id="advice-display" class="text-sm text-slate-200">Ready to vibe...</div></div>

                <div class="w-full flex flex-col items-center gap-3">

                    <div class="w-full bg-white/5 border border-white/10 rounded-full px-6 py-1">

                        <input type="text" id="user-text" placeholder="Tell me anything..." class="bg-transparent border-none outline-none w-full h-12 text-white">

                    </div>

                    <p class="text-[8px] text-slate-500 font-bold uppercase tracking-widest">Tap Enter to Send</p>

                </div>

            </div>

        </div>

    </div>



<script type="module">

    import { FaceLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3";



    let faceLandmarker, video = document.getElementById("webcam"), currentMood = "Neutral";

    let camStream = null, micStream = null, mediaRecorder, audioChunks = [], voteBuffer = [];



    // --- DEVICE ISOLATION LOGIC ---

    let deviceId = localStorage.getItem('emote_device_id');

    if (!deviceId) {

        deviceId = 'dev_' + Math.random().toString(36).substr(2, 9);

        localStorage.setItem('emote_device_id', deviceId);

    }



    const ems = ["🫣","😀","😔","😡","😲"];

    let emojiIdx = 0; 

    setInterval(() => { document.getElementById('emoji-swap').innerText = ems[emojiIdx++ % ems.length]; }, 1500);



    window.toggleSidebar = () => document.getElementById('sidebar').classList.toggle('open');



    document.getElementById('launch-btn').onclick = () => {

        document.getElementById('onboarding').style.display = 'none';

        document.getElementById('privacy-popup').style.display = 'flex';

    };



    document.getElementById('accept-privacy').onclick = async () => {

        document.getElementById('privacy-popup').style.display = 'none';

        document.getElementById('app-ui').style.display = 'flex';

        document.getElementById('menu-btn').classList.add('visible');

        renderHistory();

        const vision = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/wasm");

        faceLandmarker = await FaceLandmarker.createFromOptions(vision, {

            baseOptions: { modelAssetPath: "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task", delegate: "GPU" },

            outputFaceBlendshapes: true, runningMode: "VIDEO", numFaces: 1

        });

    };



    document.getElementById('camBtn').onclick = async () => {

        const btn = document.getElementById('camBtn');

        if (camStream) {

            camStream.getTracks().forEach(t => t.stop()); camStream = null;

            btn.style.background = "rgba(255,255,255,0.05)";

        } else {

            camStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });

            video.srcObject = camStream;

            btn.style.background = "var(--accent)";

            video.onloadedmetadata = () => runDetection();

        }

    };



    function runDetection() {

        if (!camStream || !faceLandmarker) return;

        const result = faceLandmarker.detectForVideo(video, performance.now());

        if (result.faceBlendshapes?.[0]) {

            const s = result.faceBlendshapes[0].categories.reduce((acc, c) => (acc[c.categoryName] = c.score, acc), {});

            let instant = "Neutral";

            if (s.eyeWideLeft > 0.1 || s.jawOpen > 0.5) instant = "Surprised";

            else if (s.mouthSmileLeft > 0.2) instant = "Happy";

            else if (s.browInnerUp > 0.6) instant = "Sad";

            else if (s.browDownLeft > 0.15) instant = "Frustrated";



            voteBuffer.push(instant);

            if (voteBuffer.length > 25) {

                const winner = voteBuffer.reduce((a, b, i, arr) => (arr.filter(v => v===a).length >= arr.filter(v => v===b).length ? a : b));

                if (winner !== currentMood) {

                    currentMood = winner;

                    document.body.className = `theme-${winner.toLowerCase()}`;

                    document.getElementById('mood-label').innerText = winner;

                }

                voteBuffer.shift();

            }

        }

        requestAnimationFrame(runDetection);

    }



    async function sendData(payload, isAudio = false) {

        try {

            const url = 'https://hahe050305-emote-bro-finalpunch.hf.space/analyze';

            let body;

            if (isAudio) {

                payload.append('device_id', deviceId); // Attach ID to audio form

                body = payload;

            } else {

                body = JSON.stringify({...payload, face: currentMood, device_id: deviceId}); // Attach ID to JSON

            }



            let res = await fetch(url, { 

                method: 'POST', 

                headers: isAudio ? {} : {'Content-Type': 'application/json'}, 

                body: body 

            });

            const data = await res.json();

            typeWriter(data.advice);

            saveChat(isAudio ? "Voice" : "Text", data.advice);

        } catch(e) { console.error("Server Error:", e); }

    }



    document.getElementById('user-text').onkeypress = (e) => {

        if(e.key === 'Enter' && e.target.value.trim() !== "") {

            sendData({ text: e.target.value });

            e.target.value = "";

        }

    };



    document.getElementById('micBtn').onclick = async () => {

        const btn = document.getElementById('micBtn');

        if (mediaRecorder?.state === "recording") {

            mediaRecorder.stop();

            btn.style.background = "rgba(255,255,255,0.05)";

        } else {

            micStream = micStream || await navigator.mediaDevices.getUserMedia({ audio: true });

            mediaRecorder = new MediaRecorder(micStream);

            audioChunks = [];

            mediaRecorder.onstart = () => btn.style.background = "#ef4444";

            mediaRecorder.onstop = () => {

                const fd = new FormData();

                fd.append('audio', new Blob(audioChunks));

                fd.append('face', currentMood);

                sendData(fd, true);

            };

            mediaRecorder.ondataavailable = e => audioChunks.push(e.data);

            mediaRecorder.start();

        }

    };



    function saveChat(type, text) {

        const h = JSON.parse(localStorage.getItem('emote_chats') || "[]");

        h.unshift({ type: type || "System", text: text || "...", time: new Date().toLocaleTimeString() });

        localStorage.setItem('emote_chats', JSON.stringify(h.slice(0, 15)));

        renderHistory();

    }



    function renderHistory() {

        const list = document.getElementById('history-list');

        const data = JSON.parse(localStorage.getItem('emote_chats') || "[]");

        list.innerHTML = data.map(item => `

            <div class="history-item">

                <div class="text-[8px] opacity-40 font-bold mb-1 uppercase">${item.type || 'Chat'} • ${item.time || 'now'}</div>

                <div>${item.text || '...'}</div>

            </div>

        `).join('');

    }



    function typeWriter(text) {

        const el = document.getElementById('advice-display'); el.innerHTML = "";

        let i = 0; const itv = setInterval(() => {

            if (i < text.length) el.innerHTML += text.charAt(i++);

            else clearInterval(itv);

        }, 25);

    }

</script>

</body>

</html>
